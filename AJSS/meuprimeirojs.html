<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro JavaScript</title>
</head>
<body>
    <h2>O que o Javascript pode fazer?</h2>

    <p id="demo">JavaScript pode mudar o conteúdo HTML</p>
    <p id="demo2">JavaScript pode mudar a cor do texto</p>
    <p id="demo3">Olá!</p>

    <button type="button"
        onclick='document.getElementById("demo").innerHTML =
        "Alô, JavaScript!"'>Clique aqui!</button>
    </button>

     <button type="button"
        onclick='document.getElementById("demo3").innerHTML=
        "Boa tarde"'>Clique aqui!</button>
    </button>

    <button type="button"
        onclick='document.getElementById("demo").style.color =
        "orange"'>Laranja!</button>
    </button>

    <button type="button"
        onclick='document.getElementById("demo2").style.color =
        "purple"'>Roxo!</button>
    </button>
</body>
</html>
