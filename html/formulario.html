<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu formulário</title>
</head>
 <link rel="stylesheet" href="./formulario.css">
<body>
    <img src="detalheSite.png"; height="300">
    <form id= "meuFormulario" 
        action="https://webhook.site/e608a6e7-41af-440c-bad8-fb50105fc783?"
        method="post">

        <label for="nome"> Nome </label>
        
        <input type="text" id="nome" style="color: white;""
        placeholder="digite seu nome"
        required>

        <label  for="email"> Email </label>
            <input type="email" id="email" style="color: white;"
            placeholder="digite seu email" required>

        
        <label for="senha"> Senha </label>
            <input type="password" style="color: white;"
            placeholder="digite sua senha"
            minlength="8"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
            id="senha" 
            required>
            
        <label  for="Idade"> Idade </label>
            <input type="number" id="Idade" style="color: white;"
            placeholder="digite sua idade"
            min="0" max="120" step="1"
            value="14"
            required>

            <button type="submit">Enviar</button>
    </form>
</body>
</html>
