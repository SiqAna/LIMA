<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <h1> Formulário de Cadastro </h1>
    <form action="https://webhook.site/e608a6e7-41af-440c-bad8-fb50105fc783?" method="POST">
        <label for="nome">Nome:</label>
        <input 
        type="text" 
        id="nome" 
        name="nome" 
        required 
        minlength="2"
        maxlength="50"
        placeholder="Digite seu nome"
        >
        <br><br>

        <label for="email">Email:</label>
        <input type="email" 
        id="email" 
        name="email" 
        required
        placeholder="Digite seu email"
        >
        <br><br>

        <label for="telefone">Telefone:</label>
        <input type="tel" 
        id="telefone" 
        name="telefone" 
        required
        placeholder="(XX) XXXXX-XXXX"
        pattern="\(\d{2}\) \d{4,5}-\d{4}"
        >
        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" 
        id="idade" 
        name="idade" 
        placeholder="Digite sua idade"
        required
        min="18"
        max="120"
        step="1">
        <br><br>

        <label for="data-nascimento">Data de Nascimento:</label>
        <input type="date" 
        id="data-nascimento" 
        name="data-nascimento" 
        required
        min="1900-01-01" 
        max= currentDate() 
        >
        <br><br>

        <label for="website">Página Pessoal</label>
        <input type="url" 
        id="website" 
        name="website" 
        placeholder="Digite o URL da sua página"
        >
        <br><br>

        <label for="comentarios">Comentários</label>
        <textarea type="text" 
        id="comentarios" 
        name="comentarios" 
        rows="4"
        cols="80"
        maxlength="500"
        placeholder="Digite seus comentarios"
        ></textarea>
        <br><br>

        <button type="submit" value="Cadastrar" style="color:white"></button>
        <br>
        <img src= "Ena-PNG.png">
</body>
</html>
