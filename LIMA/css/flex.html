<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Display flex</title>
        <style>
            .container{
                display: flex;
                flex-wrap: wrap;
                justify-content: space-evenly;
                flex-direction: row;
                background-color: rgb(176, 50, 90);
                height: 200px;
                align-items: center;
                align-content: center;

            }
            .container div{
                font-size: 50px;
                background-color: rgb(228, 187, 196);
                width: 100px;
                height: 60px;
                margin: 10px;
                padding: 10px;
                text-align: center;
            }
        </style>
    </head>

    <body>
        
        <H1>Flex</H1>
        <p> para usar o flex é necessário haver um elemento ancestral com estilização
            display: flex
        </p>
        <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9


            
        </div>
        </div>
    </body>
</html>
